<div class="settings-page">
  <header class="settings-header">
    <div>
      <h1>Settings</h1>
      <p>Manage system preferences, users and vessel configuration</p>
    </div>
  </header>

  <nav class="settings-tabs" aria-label="Settings sections">
    <button type="button" *ngFor="let tab of tabs" [class.active]="activeTab === tab.id" (click)="selectTab(tab.id)">
      <i [class]="tab.icon"></i>
      {{ tab.label }}
    </button>
  </nav>

  <app-settings-general *ngIf="activeTab === 'general'"></app-settings-general>
  <app-settings-users *ngIf="activeTab === 'users'"></app-settings-users>
  <app-settings-vessels *ngIf="activeTab === 'vessels'"></app-settings-vessels>
  <app-settings-groups *ngIf="activeTab === 'groups'"></app-settings-groups>
</div>
