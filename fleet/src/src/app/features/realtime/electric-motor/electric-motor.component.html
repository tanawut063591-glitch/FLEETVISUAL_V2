<section
  class="motor-console"
  [class.motor-console--running]="isRunning"
  [class.motor-console--stopped]="!isRunning"
>
  <div class="motor-stage">
    <div class="motor-grid" aria-hidden="true"></div>

    <div class="motor-stage__top">
      <div class="motor-stage__title">
        <span>ELECTRIC DRIVE</span>
        <small>PROPULSION MOTOR</small>
      </div>

    </div>

    <div class="motor-visual" role="img" aria-label="Electric propulsion motor and shaft">
      <div class="motor-orbit motor-orbit--outer" aria-hidden="true"></div>
      <div class="motor-orbit motor-orbit--inner" aria-hidden="true"></div>

      <svg class="motor-art" viewBox="0 0 560 290" focusable="false" aria-hidden="true">
        <defs>
          <linearGradient id="motorBody" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4f8df8"></stop>
            <stop offset="0.46" stop-color="#1f66da"></stop>
            <stop offset="1" stop-color="#0f47b5"></stop>
          </linearGradient>
          <linearGradient id="motorBodyShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3f83ef"></stop>
            <stop offset="1" stop-color="#1454c7"></stop>
          </linearGradient>
          <linearGradient id="motorMetal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f1f5f9"></stop>
            <stop offset="0.42" stop-color="#cbd5e1"></stop>
            <stop offset="1" stop-color="#8494a9"></stop>
          </linearGradient>
          <linearGradient id="motorDarkMetal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6b7c92"></stop>
            <stop offset="1" stop-color="#344155"></stop>
          </linearGradient>
          <linearGradient id="motorShaft" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#eef2f7"></stop>
            <stop offset="0.5" stop-color="#aebdce"></stop>
            <stop offset="1" stop-color="#64748b"></stop>
          </linearGradient>
          <filter id="motorDropShadow" x="-30%" y="-40%" width="180%" height="210%">
            <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"></feDropShadow>
          </filter>
          <filter id="motorSoftGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="3.2" result="blur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>

        <ellipse class="motor-art__ground" cx="286" cy="253" rx="184" ry="17"></ellipse>

        <g class="motor-energy" aria-hidden="true">
          <path d="M22 151H76"></path>
          <circle cx="32" cy="151" r="4"></circle>
          <circle cx="48" cy="151" r="4"></circle>
          <circle cx="64" cy="151" r="4"></circle>
        </g>

        <g class="motor-machine" filter="url(#motorDropShadow)">
          <g class="motor-rear">
            <path d="M90 103c0-18 14-32 32-32h16v148h-16c-18 0-32-14-32-32z" fill="url(#motorMetal)"></path>
            <path d="M112 91v108"></path>
            <circle cx="121" cy="145" r="4"></circle>
          </g>

          <g class="motor-body">
            <rect x="128" y="72" width="232" height="153" rx="15" fill="url(#motorBody)"></rect>
            <rect x="141" y="84" width="206" height="13" rx="6" fill="rgba(255,255,255,.20)"></rect>
            <path class="motor-fin" d="M154 88v123M178 88v123M202 88v123M226 88v123M250 88v123M274 88v123M298 88v123M322 88v123M346 88v123"></path>
            <path class="motor-body-edge" d="M135 77h217v141H135"></path>

            <rect class="motor-plate" x="187" y="126" width="118" height="54" rx="7"></rect>
            <text class="motor-plate__small" x="246" y="146" text-anchor="middle">ELECTRIC</text>
            <text class="motor-plate__large" x="246" y="166" text-anchor="middle">PROPULSION</text>

            <g class="motor-bolts">
              <circle cx="142" cy="88" r="3"></circle>
              <circle cx="346" cy="88" r="3"></circle>
              <circle cx="142" cy="211" r="3"></circle>
              <circle cx="346" cy="211" r="3"></circle>
            </g>
          </g>

          <g class="motor-terminal">
            <rect x="196" y="31" width="104" height="48" rx="8" fill="url(#motorBodyShade)"></rect>
            <rect x="202" y="37" width="92" height="36" rx="5"></rect>
            <path class="motor-bolt-icon" d="M252 40l-15 21h12l-7 15 22-25h-13z"></path>
            <circle cx="204" cy="39" r="2.5"></circle>
            <circle cx="292" cy="39" r="2.5"></circle>
          </g>

          <g class="motor-front">
            <path d="M360 91h31c22 0 40 18 40 40v35c0 22-18 40-40 40h-31z" fill="url(#motorMetal)"></path>
            <path class="motor-front__seam" d="M371 99v98"></path>
            <circle class="motor-flange" cx="402" cy="149" r="30"></circle>
            <circle class="motor-rotor-ring" cx="402" cy="149" r="18"></circle>
            <g class="motor-rotor">
              <circle cx="402" cy="149" r="11"></circle>
              <path d="M402 139v20M392 149h20"></path>
            </g>
          </g>

          <g class="motor-coupling">
            <rect x="430" y="132" width="20" height="34" rx="5" fill="url(#motorDarkMetal)"></rect>
            <rect x="446" y="127" width="18" height="44" rx="5" fill="url(#motorMetal)"></rect>
            <path d="M451 133v32M458 133v32"></path>
          </g>

          <g class="motor-shaft">
            <rect x="462" y="137" width="72" height="24" rx="10" fill="url(#motorShaft)"></rect>
            <circle cx="533" cy="149" r="13" fill="url(#motorShaft)"></circle>
            <path class="motor-shaft__highlight" d="M472 141h52"></path>
          </g>

          <g class="motor-feet">
            <path d="M160 221h66v25h-84v-10c0-8 6-15 14-15z"></path>
            <path d="M301 221h43c9 0 16 7 16 15v10h-82v-25z"></path>
          </g>
        </g>
      </svg>
    </div>

    <div class="motor-signal" aria-hidden="true">
      <span class="motor-signal__bars">
        <i></i><i></i><i></i><i></i><i></i>
      </span>
      <strong>DRIVE SIGNAL</strong>
      <svg viewBox="0 0 260 28" preserveAspectRatio="none">
        <path class="motor-wave motor-wave--base" d="M0 15H260"></path>
        <path class="motor-wave motor-wave--live" d="M0 15 C10 15 12 7 20 7 S30 23 38 15 S48 8 56 15 S66 21 74 15 S85 5 94 15 S104 22 112 15 S122 9 130 15 S140 19 148 15 S160 6 168 15 S178 23 186 15 S198 9 206 15 S218 18 226 15 S238 11 246 15 H260"></path>
      </svg>
    </div>
  </div>

  <div
    class="motor-rpm"
    [class.realtime-alert-field]="hasAlarm(speed)"
    [attr.title]="getTooltip(speed)"
  >
    <div class="motor-rpm__row">
      <div class="motor-rpm__identity">
        <span class="motor-rpm__icon" aria-hidden="true"><i class="fa fa-bolt"></i></span>
        <span class="motor-rpm__copy">
          <small>SHAFT SPEED</small>
          <strong>LIVE RPM</strong>
        </span>
      </div>

      <div class="motor-rpm__value">
        <strong>{{ displayNumber(speed, 2) }}</strong>
        <small>RPM</small>
      </div>
    </div>

    <div class="motor-rpm__meter" aria-hidden="true">
      <div class="motor-rpm__track">
        <span class="motor-rpm__fill" [style.width.%]="speedPercent"></span>
      </div>
      <div class="motor-rpm__scale">
        <span>0</span>
        <span>500</span>
        <span>1000</span>
        <span>1500</span>
        <span>{{ maxRpm }}</span>
      </div>
    </div>
  </div>
</section>
