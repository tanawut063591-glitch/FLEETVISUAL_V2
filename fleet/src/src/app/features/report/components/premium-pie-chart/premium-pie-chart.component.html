<section class="premium-pie-card" [class.is-empty]="!hasData">
  <header class="premium-pie-card__header">
    <div>
      <small>{{ eyebrow }}</small>
      <h3>{{ title }}</h3>
    </div>
    <span class="premium-pie-card__hint">
      <i class="fa fa-hand-pointer-o" aria-hidden="true"></i>
      Hover / click
    </span>
  </header>

  <div class="premium-pie-card__body" *ngIf="hasData; else emptyState">
    <highcharts-chart
      class="premium-pie-chart"
      [options]="chartOptions"
      [(update)]="updateChart"
      [oneToOne]="true">
    </highcharts-chart>
  </div>

  <ng-template #emptyState>
    <div class="premium-pie-card__empty">
      <span><i class="fa fa-pie-chart" aria-hidden="true"></i></span>
      <div>
        <strong>No chart data</strong>
        <p>{{ emptyText }}</p>
      </div>
    </div>
  </ng-template>
</section>
