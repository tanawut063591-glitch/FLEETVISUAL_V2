<div class="confirm-dialog-overlay">
  <div class="confirm-dialog-container">
    <div class="dialog-header">
      <div class="icon-wrapper" [class.warning]="data.type === 'warning'" [class.danger]="data.type === 'danger'">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </div>
      <h2>{{ data.title || 'Confirm Action' }}</h2>
    </div>

    <div class="dialog-content">
      <p class="main-message" [innerHTML]="data.message || 'Are you sure you want to proceed?'"></p>
      
      <p class="sub-message">
        {{ data.subMessage || '' }}
      </p>
    </div>

    <div class="dialog-actions">
      <button class="btn-secondary" (click)="onCancel()">
        {{ data.cancelText || 'Cancel' }}
      </button>
      <button class="btn-primary" 
              [class.btn-danger]="data.type === 'danger'"
              (click)="onConfirm()">
        {{ data.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
