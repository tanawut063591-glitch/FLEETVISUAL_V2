<aside class="report-info-bar">
  <div class="panel-title">
    <span class="title-icon"><i [class]="icon" aria-hidden="true"></i></span>
    <div>
      <small>{{ eyebrow }}</small>
      <strong>{{ title || '-' }}</strong>
    </div>
  </div>

  <div class="summary-grid">
    <div class="summary-card" *ngFor="let item of items" [class.file-card]="item.wide">
      <span>
        <i *ngIf="item.icon" [class]="item.icon" aria-hidden="true"></i>
        {{ item.label }}
      </span>
      <strong>{{ displayValue(item.value) }}</strong>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="primary-action" [disabled]="primaryDisabled" (click)="primaryAction.emit()">
      <i [class]="primaryIcon" aria-hidden="true"></i>
      {{ primaryLabel }}
    </button>

    <button type="button" class="secondary-action" [disabled]="secondaryDisabled" (click)="secondaryAction.emit()">
      <i [class]="secondaryIcon" aria-hidden="true"></i>
      {{ secondaryLabel }}
    </button>
  </div>
</aside>
