<div class="container w-100 h-100 bz" >
    <svg class="progress-ring bz" viewBox="0 0 90 90">
        <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:var(--color-gd2);stop-opacity:1" />
                <!-- <stop offset="51%" style="stop-color:#3ACAA9;stop-opacity:1" /> -->
                <stop offset="100%" style="stop-color:var(--color-gd1);stop-opacity:1" />
            </linearGradient>
        </defs>
        <circle class="progress-ring-circle" [style.--progress-percent]="getProgressionPercentage()" cx="45" cy="45" r="38"></circle>
    </svg>

    <!-- วงกลมหลัก -->
    <div class="main-circle bz">
        <div class="center-unit">{{ title() || '' }}</div>
        <div class="center-value">{{ value() || '' }}</div>
        <div class="center-unit">{{ unit() || '' }}</div>
    </div>
</div>
