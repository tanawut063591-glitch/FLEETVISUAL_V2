<div class="permission-dialog">
  <div class="icon-box">
    <span class="material-icons">lock</span>
  </div>

  <h2>Permission Denied</h2>

  <p>
    {{ data.message || 'You do not have permission to access this page.' }}
  </p>

  <div class="detail">
    <strong>Page:</strong>
    <span>{{ data.routePath || '-' }}</span>
  </div>

  <button mat-raised-button color="primary" type="button" (click)="close()">
    OK
  </button>
</div>
