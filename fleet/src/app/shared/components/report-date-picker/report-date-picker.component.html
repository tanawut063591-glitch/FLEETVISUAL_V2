<label class="report-date-picker">
  <span class="field-label">{{ label }}</span>

  <div class="field-control">
    <i [class]="icon" aria-hidden="true"></i>
    <input [type]="mode" [ngModel]="value" [disabled]="disabled" [attr.min]="min || null" [attr.max]="max || null"
      [attr.aria-label]="label" (ngModelChange)="onValueChange($event)" />
  </div>

  <em *ngIf="hint">{{ hint }}</em>
</label>
