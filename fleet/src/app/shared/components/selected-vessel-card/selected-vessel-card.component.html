<div class="selected-vessel" [class.empty]="isEmpty" [class.offline]="status === 'offline'" [class.idle]="status === 'idle'">
  <span class="vessel-status"></span>

  <div class="vessel-copy">
    <small>{{ label }}</small>
    <strong>{{ displayName }}</strong>
  </div>

  <img *ngIf="imageSrc" [src]="imageSrc" alt="Selected vessel" />
</div>
