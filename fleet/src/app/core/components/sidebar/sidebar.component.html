<button
  class="sidebar-toggle-btn"
  type="button"
  *ngIf="isSm"
  aria-label="Open vessel selector"
  aria-controls="mobile-vessel-drawer"
  [attr.aria-expanded]="isShowMenu"
  (click)="toggle()"
>
  <i class="fa fa-ship" aria-hidden="true"></i>
  <span>Vessels</span>
  <strong>{{ visibleVessels.length }}</strong>
</button>

<div
  class="sidebar-backdrop"
  *ngIf="isSm && isShowMenu"
  (click)="closeMobileSidebar()"
></div>

<div id="mobile-vessel-drawer" class="main" [class.is-open]="isShowMenu"
  [attr.aria-hidden]="isSm && !isShowMenu" [attr.inert]="isSm && !isShowMenu ? '' : null">
  <aside class="vessel-sidebar">

    <div class="sidebar-search-row">
      <div class="search-box">
        <i class="fa fa-search search-icon" aria-hidden="true"></i>

        <input
          #searchInput
          type="search"
          aria-label="Search vessels"
          placeholder="Search vessel..."
          [value]="keyword"
          (input)="onSearch(searchInput.value)"
        />
      </div>

      <button
        class="close-btn"
        type="button"
        *ngIf="isSm"
        aria-label="Close vessel selector"
        (click)="closeMobileSidebar()"
      >
        <i class="fa fa-times" aria-hidden="true"></i>
      </button>
    </div>

    <div class="vessel-list-header" aria-live="polite">
      <span class="vessel-list-label">
        {{ keyword.trim() ? 'SEARCH RESULTS' : 'ALL VESSELS' }}
      </span>

      <span class="vessel-list-count" [attr.aria-label]="visibleVessels.length + ' vessels'">
        {{ visibleVessels.length }}
      </span>
    </div>

    <div #vesselList class="vessel-list" *ngIf="visibleVessels.length > 0"
      (scroll)="onVesselListScroll(vesselList.scrollTop)">
      <div
        #vesselCard
        class="vessel-card"
        *ngFor="let vessel of visibleVessels; trackBy: trackByVessel"
        [class.active]="vessel.isActive"
        role="button" tabindex="0"
        [attr.aria-label]="'Select vessel ' + vessel.name"
        [attr.aria-pressed]="vessel.isActive"
        (click)="selectVessel(vessel)"
        (keydown.enter)="selectVessel(vessel)"
        (keydown.space)="$event.preventDefault(); selectVessel(vessel)"
      >
        <div class="selected-line"></div>

        <div class="vessel-image">
          <img
            [src]="vessel.image"
            [alt]="vessel.name"
            loading="lazy"
          />
        </div>

        <div class="vessel-info">
          <div class="vessel-row top">
            <div class="vessel-name">
              {{ vessel.name }}
            </div>

            <div
              class="status-badge"
              [class.online]="vessel.statusClass === 'online'"
              [class.idle]="vessel.statusClass === 'idle'"
              [class.offline]="vessel.statusClass === 'offline'"
            >
              <span
                class="status-dot-small"
                *ngIf="vessel.status === 'Idle'"
              ></span>

              {{ vessel.status }}
            </div>
          </div>

          <div class="vessel-type">
            {{ vessel.type }}
          </div>

          <div class="vessel-row bottom">
            <div class="vessel-coordinate">
              {{ vessel.coordinate }}
            </div>

            <div class="vessel-time" [ngClass]="vessel.statusClass">
              {{ vessel.lastSeen }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="visibleVessels.length === 0">
      <div class="empty-icon">
        <i class="fa fa-ship"></i>
      </div>

      <div class="empty-title">
        No vessels found
      </div>

      <div class="empty-desc">
        Try another vessel name
      </div>
    </div>
  </aside>
</div>
