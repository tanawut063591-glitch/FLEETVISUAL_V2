<header class="fleet-header">
  <button class="brand" type="button" (click)="goTo('/main')">
    <img src="assets/images/vessel/LocationEyeIcon.png" alt="Fleet Visual" />

    <span>
      <strong>FLEET VISUAL</strong>
      <small>Maritime Fleet Monitoring System</small>
    </span>
  </button>

  <nav class="header-nav" aria-label="Main navigation">
    <button
      type="button"
      class="nav-item"
      *ngFor="let item of menuItems"
      (click)="goTo(item.path)"
    >
      <i [class]="item.icon"></i>
      <span>{{ item.label }}</span>
    </button>
  </nav>

  <div class="header-actions">
    <button class="icon-btn notification-btn" type="button" aria-label="Alerts">
      <i class="fa fa-bell-o"></i>
      <span class="alert-count" *ngIf="alertCount > 0">{{ alertCount }}</span>
    </button>

    <div class="settings-wrap" [class.open]="settingsMenuOpen">
      <button
        class="icon-btn"
        type="button"
        aria-label="Settings"
        (click)="toggleSettingsMenu($event)"
      >
        <i class="fa fa-cog"></i>
      </button>

      <div class="settings-dropdown">
        <div class="dropdown-title">System Settings</div>

        <button type="button" class="dropdown-item" (click)="goTo('/main')">
          <i class="fa fa-sliders"></i>
          <span>
            <strong>General Settings</strong>
            <small>System preferences</small>
          </span>
        </button>

        <button type="button" class="dropdown-item" (click)="goTo('/main')">
          <i class="fa fa-ship"></i>
          <span>
            <strong>Vessel Management</strong>
            <small>Manage vessel profiles</small>
          </span>
        </button>

        <button type="button" class="dropdown-item danger" (click)="logout()">
          <i class="fa fa-sign-out"></i>
          <span>
            <strong>Logout</strong>
            <small>Back to login page</small>
          </span>
        </button>
      </div>
    </div>

    <div class="user-chip">
      <div class="avatar">
        <img
          *ngIf="!avatarError"
          [src]="userImage"
          alt="User avatar"
          (error)="onUserImageError()"
        />
        <span *ngIf="avatarError">{{ userInitial }}</span>
      </div>

      <span class="user-meta">
        <strong>{{ username }}</strong>
        <small>Operator</small>
      </span>
    </div>
  </div>
</header>
