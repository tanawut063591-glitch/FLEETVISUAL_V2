<header class="fleet-header noselect">
  <!-- LOGO -->
  <a
    class="brand-box"
    [routerLink]="['/main/overview']"
    (click)="closeSettingsMenu(); closeMobileMenu()"
  >
    <img
      class="main-logo"
      [src]="logoSrc"
      alt="Fleet Visual Logo"
      (error)="onLogoError($event)"
    />
  </a>

  <!-- MOBILE TOGGLER -->
  <button
    type="button"
    class="mobile-toggler"
    [class.active]="mobileMenuOpen"
    aria-label="Toggle navigation"
    aria-controls="mobile-main-navigation"
    [attr.aria-expanded]="mobileMenuOpen"
    (click)="toggleMobileMenu($event)"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div
    class="mobile-menu-backdrop"
    *ngIf="mobileMenuOpen"
    (click)="closeMobileMenu()"
    aria-hidden="true"
  ></div>

  <!-- CENTER MENU -->
  <nav
    id="mobile-main-navigation"
    class="main-menu"
    [class.open]="mobileMenuOpen"
    aria-label="Main navigation"
  >
    <a
      *ngFor="let item of menuItems"
      class="nav-item"
      [class.is-alert]="item.isAlert"
      [class.is-log]="item.isLog"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      (click)="closeSettingsMenu(); closeMobileMenu()"
      [hidden]="item.show === false"
    >
      <div class="nav-icon">
        <i [class]="item.icon" aria-hidden="true"></i>

        <span
          class="alert-count"
          *ngIf="item.isAlert && alertCount > 0"
        >
          {{ alertCount }}
        </span>
      </div>

      <div class="nav-text">
        {{ item.label }}
      </div>
    </a>
  </nav>

  <!-- RIGHT ACTIONS -->
  <section class="right-menu" [class.mobile-open]="mobileMenuOpen">
    <!-- SETTINGS -->
    <div class="settings-action-wrap" [class.open]="settingsMenuOpen">
      <button
        type="button"
        class="settings-action-btn"
        title="Settings"
        (click)="toggleSettingsMenu($event)"
      >
        <i class="fa fa-cog" aria-hidden="true"></i>
      </button>

      <div class="settings-dropdown">
        <div class="dropdown-title">
          System Settings
        </div>

        <button
          type="button"
          class="dropdown-item"
          *ngFor="let item of settingsItems"
          (click)="goTo(item.route)"
        >
          <span class="dropdown-icon" [class]="item.color">
            <i [class]="item.icon" aria-hidden="true"></i>
          </span>

          <div class="dropdown-copy">
            <strong>{{ item.title }}</strong>
            <small>{{ item.subtitle }}</small>
          </div>
        </button>
      </div>
    </div>

    <!-- DARK MODE -->
    <button
      type="button"
      class="dark-mode-pill"
      [class.active]="isDarkMode"
      (click)="toggleDarkMode($event)"
    >
      <span class="dark-icon">
        <i
          class="fa"
          [class.fa-moon-o]="!isDarkMode"
          [class.fa-sun-o]="isDarkMode"
          aria-hidden="true"
        ></i>
      </span>

      <span class="dark-copy">
        <strong>{{ isDarkMode ? 'LIGHT' : 'DARK' }}</strong>
        <small>Switch mode</small>
      </span>
    </button>

    <!-- USER -->
    <div class="user-profile-pill">
      <div class="user-avatar">
        <img
          *ngIf="!avatarError && userImage"
          [src]="userImage"
          alt="User"
          (error)="onUserImageError()"
        />

        <span *ngIf="avatarError || !userImage" class="user-initial">
          {{ userInitial }}
        </span>
      </div>

      <div class="user-info">
        <span class="user-label">USER</span>
        <strong>{{ username || 'User' }}</strong>
      </div>
    </div>

    <!-- LOGOUT -->
    <button type="button" class="logout-item" (click)="logout()">
      <div class="logout-icon">
        <i class="fa fa-sign-out" aria-hidden="true"></i>
      </div>

      <div class="logout-text">
        LOGOUT
      </div>
    </button>
  </section>
</header>
