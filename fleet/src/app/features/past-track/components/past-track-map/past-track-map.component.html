<section class="map-panel">

    <div class="panel-header">
        <div>
            <h3>ROUTE MAP</h3>
            <p>Historical vessel route from Latitude / Longitude</p>
        </div>

        <div class="legend">
            <span><i class="dot sailing"></i> Sailing</span>
            <span><i class="dot idle"></i> Idle</span>
            <span><i class="dot nodata"></i> No Data</span>
        </div>
    </div>

    <div class="map-wrap">
        <div #pastTrackMap class="google-map" [class.hide-map]="useFallbackMap"></div>

        <div class="map-type-switch" *ngIf="!useFallbackMap" role="group" aria-label="Map type">
            <button
                type="button"
                [class.active]="mapType === 'roadmap'"
                (click)="setMapType('roadmap')">
                Map
            </button>
            <button
                type="button"
                [class.active]="mapType === 'satellite'"
                (click)="setMapType('satellite')">
                Satellite
            </button>
        </div>

        <div class="fallback-map" *ngIf="useFallbackMap">
            <div class="map-label thailand">Thailand</div>
            <div class="map-label malaysia">Malaysia</div>
            <div class="map-label gulf">Gulf of Thailand</div>

            <svg class="route-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                <polyline
                    [attr.points]="uiRoutePoints"
                    fill="none"
                    stroke="#1769ff"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round">
                </polyline>
            </svg>

            <button
                *ngFor="let item of uiMapPoints"
                type="button"
                class="map-point"
                [ngClass]="getFallbackPointClass(item.point)"
                [style.left.%]="item.x"
                [style.top.%]="item.y"
                [attr.aria-label]="'Route position ' + item.point.time"
                (click)="selectFallbackPoint(item.point)">
                {{ getFallbackPointLabel(item.point) }}
            </button>

            <div class="scale">
                <span></span>
                20 nm
            </div>
        </div>

        <div class="coordinate-box" *ngIf="selectedPoint">
            {{ formatLat(selectedPoint.lat) }},
            {{ formatLng(selectedPoint.lng) }}
        </div>
    </div>

</section>
