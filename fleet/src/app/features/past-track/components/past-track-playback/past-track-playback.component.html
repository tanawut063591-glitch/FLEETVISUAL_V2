<section class="playback-panel">

    <h3>PLAYBACK CONTROL</h3>
    <p>Replay vessel movement</p>

    <div class="player-buttons">
        <button type="button" class="round" (click)="previous()">◀</button>

        <button type="button" class="play" (click)="play()">
            {{ isPlaying ? '❚❚' : '▶' }}
        </button>

        <button type="button" class="round" (click)="next()">▶</button>
    </div>

    <div class="progress-line">
        <span [style.width.%]="getProgressPercent()"></span>
    </div>

    <div class="time-row">
        <span>{{ getStartTime() }}</span>
        <span>{{ getEndTime() }}</span>
    </div>

    <div class="speed-row">
        <span>Playback Speed</span>

        <select
            [ngModel]="playbackSpeed"
            (change)="onSpeedSelect($event)">
            <option value="0.5x">0.5x</option>
            <option value="1x">1x</option>
            <option value="1.5x">1.5x</option>
            <option value="2x">2x</option>
        </select>
    </div>

</section>
