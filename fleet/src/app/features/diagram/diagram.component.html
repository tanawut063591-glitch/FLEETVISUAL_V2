<div class="diagram-page">
  <div class="diagram-header">
    <div class="diagram-title-block">
      <div class="diagram-eyebrow">SYSTEM DIAGRAM</div>
      <h1>Vessel Network Diagram</h1>
      <p>{{ vesselName }} <span *ngIf="vesselPrefix">/ {{ vesselPrefix }}</span></p>
    </div>

    <div class="diagram-stats">
      <div class="stat-card online">
        <span class="stat-dot"></span>
        <strong>{{ getSummary('online') }}</strong>
        <small>Online</small>
      </div>
      <div class="stat-card offline">
        <span class="stat-dot"></span>
        <strong>{{ getSummary('offline') }}</strong>
        <small>Offline</small>
      </div>
      <div class="stat-card unknown">
        <span class="stat-dot"></span>
        <strong>{{ getSummary('unknown') }}</strong>
        <small>No Data</small>
      </div>
      <div class="stat-card update">
        <strong>{{ lastUpdated }}</strong>
        <small>Last Update</small>
      </div>
    </div>
  </div>

  <div class="diagram-mobile-tools" aria-label="Diagram view controls">
    <div class="diagram-pan-hint">
      <span class="diagram-pan-icon" aria-hidden="true">↔</span>
      <span>Swipe to explore the full diagram</span>
    </div>

    <div class="diagram-zoom-toggle" role="group" aria-label="Diagram zoom">
      <button
        type="button"
        [class.active]="diagramZoomMode === 'fit'"
        (click)="setDiagramZoom('fit')">
        Fit
      </button>
      <button
        type="button"
        [class.active]="diagramZoomMode === 'full'"
        (click)="setDiagramZoom('full')">
        100%
      </button>
    </div>
  </div>

  <div class="diagram-scroll" #diagramViewport>
    <div class="diagram-stage" [style.width.px]="diagramStageWidth" [style.height.px]="diagramStageHeight">
      <div class="diagram-board" [style.transform]="'scale(' + diagramScale + ')'">
      <svg class="diagram-lines" viewBox="0 0 750 755" preserveAspectRatio="xMinYMin meet">
        <path class="group-box" d="M567.018 0.6H191.524C188.197 0.6 185.5 3.326 185.5 6.688V219.773C185.5 223.135 188.197 225.861 191.524 225.861H567.018C570.345 225.861 573.042 223.135 573.042 219.773V6.688C573.042 3.326 570.345 0.6 567.018 0.6Z" />
        <path class="group-box" d="M559.089 318.6H165.524C162.197 318.6 159.5 321.326 159.5 324.688V564.155C159.5 567.517 162.197 570.243 165.524 570.243H559.089C562.416 570.243 565.113 567.517 565.113 564.155V324.688C565.113 321.326 562.416 318.6 559.089 318.6Z" />

        <path class="line-blue" d="M114.5 53.6H257.067V134.775" />
        <path class="line-blue" d="M114.5 178.407H202.851" />
        <path class="line-blue" d="M315.301 174.347H393.612" />
        <path class="line-blue" d="M257.062 262.292H697.062V144.292" />
        <path class="line-blue" d="M257.066 212.906V347.859" />
        <path class="line-blue" d="M114.5 382.359H202.851" />
        <path class="line-blue" d="M315.301 382.359H409.676" />
        <path class="line-blue" d="M369.516 382.359V484.842H409.675" />
        <path class="line-blue" d="M257.066 418.887V470.636" />

        <path class="line-green" d="M228.979 553.6V614.481H108.5V651.01" />
        <path class="line-green" d="M257.09 553.6V614.481H303.274V651.01" />
        <path class="line-green" d="M289.219 553.6V587.085H486.002V651.01" />
        <path class="line-green" d="M289.219 587.084H662.704V651.01" />
      </svg>

      <div
        *ngFor="let device of devices; trackBy: trackByDevice"
        class="device-card {{ device.id }}"
        [ngClass]="statusClass(device)"
        [title]="device.title + ' : ' + statusText(device)">

        <span class="device-status"></span>

        <div class="device-icon" [ngSwitch]="device.icon">
          <svg *ngSwitchCase="'router'" viewBox="0 0 48 48">
            <path d="M11 28h26v10H11z" />
            <path d="M17 28l-4-9M31 28l4-9" />
            <circle cx="17" cy="33" r="1.7" />
            <circle cx="24" cy="33" r="1.7" />
            <circle cx="31" cy="33" r="1.7" />
          </svg>
          <svg *ngSwitchCase="'monitor'" viewBox="0 0 48 48">
            <rect x="10" y="12" width="28" height="18" rx="3" />
            <path d="M20 36h8M24 30v6" />
          </svg>
          <svg *ngSwitchCase="'switch'" viewBox="0 0 48 48">
            <rect x="9" y="16" width="30" height="16" rx="3" />
            <circle cx="17" cy="24" r="1.8" />
            <circle cx="24" cy="24" r="1.8" />
            <circle cx="31" cy="24" r="1.8" />
          </svg>
          <svg *ngSwitchCase="'pc'" viewBox="0 0 48 48">
            <rect x="7" y="11" width="26" height="18" rx="2" />
            <circle cx="35" cy="12" r="6" />
            <path d="M18 35h9M22.5 29v6" />
          </svg>
          <svg *ngSwitchCase="'gps'" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="3" />
            <path d="M24 21V10M24 27v11M21 24H10M27 24h11M16 16l-5-5M32 16l5-5M16 32l-5 5M32 32l5 5" />
          </svg>
          <svg *ngSwitchCase="'plc'" viewBox="0 0 48 48">
            <rect x="13" y="8" width="22" height="32" rx="3" />
            <path d="M18 16h12M18 24h12M18 32h12" />
            <circle cx="17" cy="16" r="1.3" />
            <circle cx="17" cy="24" r="1.3" />
            <circle cx="17" cy="32" r="1.3" />
          </svg>
          <svg *ngSwitchCase="'module'" viewBox="0 0 48 48">
            <rect x="15" y="9" width="18" height="30" rx="3" />
            <circle cx="24" cy="18" r="2" />
            <circle cx="24" cy="30" r="2" />
          </svg>
          <svg *ngSwitchCase="'gateway'" viewBox="0 0 48 48">
            <rect x="15" y="12" width="18" height="24" rx="3" />
            <path d="M24 8v4M24 36v4M19 24h10M22 20l-4 4 4 4" />
          </svg>
          <svg *ngSwitchDefault viewBox="0 0 48 48">
            <path d="M12 32h24M16 32V20h16v12M20 20v-6h8v6" />
            <circle cx="34" cy="22" r="5" />
          </svg>
        </div>

        <div class="device-title">{{ device.title }}</div>
        <div class="device-subtitle">{{ device.subtitle }}</div>
      </div>
      </div>
    </div>
  </div>
</div>
